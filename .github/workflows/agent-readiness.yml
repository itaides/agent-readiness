# This repo's own agent-readiness gate: the build job of examples/ci/github-actions.yml, applied to the
# all-pass fixture server in testdata/. It runs examples/ci/agent-readiness-gate.sh as is, so the
# documented example gets real runs: pull requests are compared with main's latest scan and must keep
# MIN_SCORE. (The example's production job has no deployed app to watch in this repo.)
name: Agent readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MIN_SCORE: '90'
  OUT_DIR: agent-readiness-report

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://127.0.0.1:8787
      BASELINE: .agent-readiness/baseline.json
      AGENT_READINESS: node dist/cli.js
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the CLI
        run: bun install --frozen-lockfile && bun run build

      - name: Start the fixture app
        run: |
          (bun run testdata/serve.ts 8787 > app.log 2>&1 &)
          for _ in $(seq 30); do curl -fs -o /dev/null "$APP_URL" && exit 0; sleep 1; done
          echo "The fixture didn't respond at $APP_URL within 30s" >&2; cat app.log >&2; exit 1

      - name: Restore baseline from main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .agent-readiness/baseline.json
          key: agent-readiness-build-${{ github.sha }}
          restore-keys: agent-readiness-build-

      - name: Scan
        run: bash examples/ci/agent-readiness-gate.sh "$APP_URL"

      - name: Job summary
        if: always()
        run: |
          if [ -f "$OUT_DIR/report.md" ]; then cat "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-readiness-build
          path: agent-readiness-report/
          if-no-files-found: ignore

      - name: Prepare baseline
        id: baseline
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('agent-readiness-report/report.json') != '' }}
        run: mkdir -p .agent-readiness && cp "$OUT_DIR/report.json" "$BASELINE"

      - name: Save baseline
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .agent-readiness/baseline.json
          key: agent-readiness-build-${{ github.sha }}
