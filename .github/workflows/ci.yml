name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit -p .

      - name: Audit spec review dates
        run: bun run audit:specs

      - name: Unit + e2e tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify bundle size
        run: |
          size=$(stat -c%s dist/cli.js)
          total=$(cat dist/*.js | wc -c)
          echo "Main bundle: $size bytes; all chunks: $total bytes"
          if [ "$size" -gt 102400 ]; then
            echo "dist/cli.js exceeded 100 KB — investigate before merging" >&2
            exit 1
          fi
          if [ "$total" -gt 307200 ]; then
            echo "dist/ JavaScript exceeded 300 KB in total — investigate before merging" >&2
            exit 1
          fi
